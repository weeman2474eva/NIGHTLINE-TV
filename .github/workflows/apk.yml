name: NIGHTLINE TV debug APK
on:
  workflow_dispatch:
    inputs:
      panel_url:
        description: HTTPS base URL for Nightline Admin
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          NIGHTLINE_PANEL_URL: ${{ inputs.panel_url }}
        run: gradle assembleDebug "-PnightlineUrl=$NIGHTLINE_PANEL_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: NIGHTLINE-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
